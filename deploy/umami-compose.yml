# Self-hosted analytics for glassd.ca.
#
# Deploy as a Compose service in Dokploy, separate from the app, so the
# two restart independently and a site deploy never interrupts
# collection. Check Dokploy's template library first — if it carries
# Umami, prefer the template and skip this file.
#
# Routing: Dokploy puts Traefik in front and attaches services to its own
# network, so no ports are published here. Set the domain
# (stats.glassd.ca) in Dokploy's UI and it handles the route and the
# certificate. If you run this with plain `docker compose` instead,
# uncomment the port blocks and put your own proxy in front — do not
# expose either service directly.
#
# Required environment (set in Dokploy's UI, or a .env beside this file):
#   UMAMI_DB_PASSWORD   generated
#   UMAMI_APP_SECRET    openssl rand -base64 32

services:
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      # No default — an unset password should fail loudly rather than
      # boot something guessable.
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      TRACKER_SCRIPT_NAME: script.js
    # ports:
    #   - "127.0.0.1:3000:3000"
    # Uncomment when Dokploy expects services on its shared network and
    # the UI has not attached this stack for you.
    # networks:
    #   - dokploy-network

volumes:
  umami-db-data:
