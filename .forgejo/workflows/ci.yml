# Forgejo Actions CI — runs on a self-hosted forgejo-runner.
# The default "docker" label container must have node; bun is installed
# on top of it so installs stay on bun.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install bun
        run: npm install -g bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
